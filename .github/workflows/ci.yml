name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test bootstrap and configuration
        run: ./scripts/test.sh
      - name: Parse Brewfiles
        run: |
          brew bundle list --file=Brewfile
          brew bundle list --file=Brewfile.vscode
